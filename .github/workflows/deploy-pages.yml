name: Deploy The Clean Lines to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies without bundled-media scripts
        run: npm ci --ignore-scripts

      - name: Restore project images from the current public site
        env:
          SOURCE_SITE: https://the-clean-lines.thecleanlines27.chatgpt.site
        run: |
          node --input-type=module <<'NODE'
          import {readFile, mkdir, writeFile} from 'node:fs/promises';
          import {dirname} from 'node:path';

          const projects = JSON.parse(await readFile('src/projects.json', 'utf8'));
          const paths = [...new Set(projects.flatMap(project => project.images.flatMap(image => [image.src, image.thumb])) )];

          for (const path of paths) {
            const url = `${process.env.SOURCE_SITE}/${path}`;
            let response;
            for (let attempt = 1; attempt <= 3; attempt++) {
              response = await fetch(url, {redirect: 'follow'});
              if (response.ok) break;
              if (attempt < 3) await new Promise(r => setTimeout(r, 1000 * attempt));
            }
            if (!response?.ok) throw new Error(`Could not restore ${url} (${response?.status})`);
            const target = `public/${path}`;
            await mkdir(dirname(target), {recursive: true});
            await writeFile(target, Buffer.from(await response.arrayBuffer()));
          }
          console.log(`Restored ${paths.length} project image derivatives.`);
          NODE

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate scroll walkthrough frame sheets
        run: |
          mkdir -p public/assets/walkthrough/desktop
          ffmpeg -hide_banner -loglevel error -y \
            -i public/assets/video/villa-desktop.mp4 \
            -vf "fps=20,scale=1280:720:flags=lanczos,tile=2x4:nb_frames=8" \
            -frames:v 83 -start_number 0 -c:v libwebp -quality 72 \
            public/assets/walkthrough/desktop/sheet-%03d.webp
          test "$(find public/assets/walkthrough/desktop -name 'sheet-*.webp' | wc -l)" -eq 83

      - name: Build site
        run: npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
