name: Deploy The Clean Lines to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --break-system-packages --quiet gdown

      - name: Cache optimized project gallery
        id: project-cache
        uses: actions/cache@v4
        with:
          path: public/assets/projects
          key: tcl-projects-drive-v1-${{ hashFiles('scripts/drive-projects.json', 'scripts/fetch-drive-projects.mjs') }}

      - name: Generate project gallery from Google Drive originals
        if: steps.project-cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-drive-projects.mjs

      - name: Validate project gallery
        run: |
          COUNT=$(find public/assets/projects -type f -name '*.webp' | wc -l)
          echo "Project gallery contains $COUNT WebP files"
          test "$COUNT" -eq 260

      - name: Download original VOL-02 walkthrough master
        run: |
          mkdir -p public/assets/video
          gdown "1BnFpsDtqggu4ED_eBWu0jKrXP1Nh2ww8" -O public/assets/video/villa-master.mp4
          SIZE=$(stat -c%s public/assets/video/villa-master.mp4)
          echo "Master video size: $SIZE bytes"
          test "$SIZE" -gt 70000000
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=noprint_wrappers=1 public/assets/video/villa-master.mp4

      - name: Generate premium 1000-frame walkthrough sheets
        run: |
          rm -rf public/assets/walkthrough
          mkdir -p public/assets/walkthrough/desktop
          ffmpeg -hide_banner -loglevel error -y \
            -i public/assets/video/villa-master.mp4 \
            -vf "fps=30,scale=1920:1080:flags=lanczos,eq=contrast=1.035:brightness=0.004:saturation=0.97:gamma=1.015,unsharp=5:5:0.42:3:3:0.18,tpad=stop_mode=clone:stop_duration=0.24,tile=2x2:nb_frames=4" \
            -frames:v 250 -start_number 0 -c:v libwebp -q:v 86 -compression_level 4 \
            public/assets/walkthrough/desktop/sheet-%03d.webp
          COUNT=$(find public/assets/walkthrough/desktop -name 'sheet-*.webp' | wc -l)
          echo "Generated $COUNT premium walkthrough sheets"
          test "$COUNT" -eq 250

      - name: Build site
        run: npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
