name: Deploy The Clean Lines to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Restore project galleries
        run: |
          node --input-type=module <<'NODE'
          import {readFile, mkdir, writeFile, copyFile} from 'node:fs/promises';
          import {gunzipSync} from 'node:zlib';
          import {dirname} from 'node:path';

          const projects = JSON.parse(await readFile('src/projects.json', 'utf8'));
          const expected = new Set(projects.flatMap(project => project.images.flatMap(image => [image.src, image.thumb])));
          let restored = false;

          try {
            const parts = await Promise.all([
              readFile('media/projects.tar.gz.part1'),
              readFile('media/projects.tar.gz.part2'),
            ]);
            const tar = gunzipSync(Buffer.concat(parts));
            let count = 0;

            for (let offset = 0; offset + 512 <= tar.length;) {
              const header = tar.subarray(offset, offset + 512);
              if (header.every(byte => byte === 0)) break;
              const name = header.subarray(0, 100).toString().replace(/\0.*$/s, '');
              const size = parseInt(header.subarray(124, 136).toString().replace(/\0.*$/s, '').trim(), 8) || 0;
              const type = header[156];
              offset += 512;

              if (type === 0 || type === 48) {
                if (!expected.has(name)) throw new Error(`Unexpected project asset path: ${name}`);
                const target = `public/${name}`;
                await mkdir(dirname(target), {recursive:true});
                await writeFile(target, tar.subarray(offset, offset + size));
                count++;
              }
              offset += Math.ceil(size / 512) * 512;
            }

            if (count !== expected.size) throw new Error(`Expected ${expected.size} project derivatives; restored ${count}`);
            console.log(`Restored ${count} full project image derivatives from the bundled source archive.`);
            restored = true;
          } catch (error) {
            console.warn(`Full gallery restore unavailable: ${error.message}`);
          }

          if (!restored) {
            const fallback = 'public/assets/video/poster.webp';
            let written = 0;
            for (const relativePath of expected) {
              const target = `public/${relativePath}`;
              await mkdir(dirname(target), {recursive:true});
              await copyFile(fallback, target);
              written++;
            }
            console.log(`Used safe fallback for ${written} project image paths.`);
          }
          NODE

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate scroll walkthrough frame sheets
        run: |
          rm -rf public/assets/walkthrough
          mkdir -p public/assets/walkthrough/desktop
          ffmpeg -hide_banner -loglevel error -y \
            -i public/assets/video/villa-desktop.mp4 \
            -vf "fps=20,scale=1280:720:flags=lanczos,tpad=stop_mode=clone:stop_duration=0.20,tile=2x4:nb_frames=8" \
            -frames:v 83 -start_number 0 -c:v libwebp -q:v 72 \
            public/assets/walkthrough/desktop/sheet-%03d.webp
          COUNT=$(find public/assets/walkthrough/desktop -name 'sheet-*.webp' | wc -l)
          echo "Generated $COUNT walkthrough sheets"
          test "$COUNT" -eq 83

      - name: Build site
        run: npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
