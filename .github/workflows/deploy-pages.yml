name: Deploy The Clean Lines to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Cache optimized project gallery
        id: project-cache
        uses: actions/cache@v4
        with:
          path: public/assets/projects
          key: tcl-projects-drive-v1-${{ hashFiles('scripts/drive-projects.json', 'scripts/fetch-drive-projects.mjs') }}

      - name: Generate project gallery from Google Drive originals
        if: steps.project-cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-drive-projects.mjs

      - name: Validate project gallery
        run: |
          COUNT=$(find public/assets/projects -type f -name '*.webp' | wc -l)
          echo "Project gallery contains $COUNT WebP files"
          test "$COUNT" -eq 260

      - name: Generate original smooth walkthrough sheets
        run: |
          rm -rf public/assets/walkthrough
          mkdir -p public/assets/walkthrough/desktop
          ffmpeg -hide_banner -loglevel error -y \
            -i public/assets/video/villa-desktop.mp4 \
            -vf "fps=20,scale=1280:720:flags=lanczos,tpad=stop_mode=clone:stop_duration=0.20,tile=2x4:nb_frames=8" \
            -frames:v 83 -start_number 0 -c:v libwebp -q:v 72 \
            public/assets/walkthrough/desktop/sheet-%03d.webp
          COUNT=$(find public/assets/walkthrough/desktop -name 'sheet-*.webp' | wc -l)
          echo "Generated $COUNT walkthrough sheets"
          test "$COUNT" -eq 83

      - name: Build site
        run: npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
