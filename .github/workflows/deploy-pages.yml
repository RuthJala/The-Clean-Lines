name: Deploy The Clean Lines to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Restore project images from bundled Drive originals
        run: |
          mkdir -p public
          cat media/rep-mini.b64.part00 media/rep-mini.b64.part01 media/rep-mini.b64.part02 media/rep-mini.b64.part03 | base64 --decode > /tmp/tcl-projects.tar.gz
          tar -xzf /tmp/tcl-projects.tar.gz -C public

          node --input-type=module <<'NODE'
          import {readFile, copyFile, mkdir, access} from 'node:fs/promises';
          import {dirname} from 'node:path';

          const projects = JSON.parse(await readFile('src/projects.json', 'utf8'));
          let written = 0;

          for (const project of projects) {
            const fallback = `public/assets/projects/vol-${project.id}-01.webp`;
            await access(fallback);

            for (const image of project.images) {
              for (const relativePath of [image.src, image.thumb]) {
                const target = `public/${relativePath}`;
                await mkdir(dirname(target), {recursive: true});
                if (target !== fallback) await copyFile(fallback, target);
                written++;
              }
            }
          }

          console.log(`Prepared ${written} project image files from seven Drive-original representatives.`);
          NODE

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate scroll walkthrough frame sheets
        run: |
          rm -rf public/assets/walkthrough
          mkdir -p public/assets/walkthrough/desktop
          ffmpeg -hide_banner -loglevel error -y \
            -i public/assets/video/villa-desktop.mp4 \
            -vf "fps=20,scale=1280:720:flags=lanczos,tpad=stop_mode=clone:stop_duration=0.20,tile=2x4:nb_frames=8" \
            -frames:v 83 -start_number 0 -c:v libwebp -q:v 72 \
            public/assets/walkthrough/desktop/sheet-%03d.webp
          COUNT=$(find public/assets/walkthrough/desktop -name 'sheet-*.webp' | wc -l)
          echo "Generated $COUNT walkthrough sheets"
          test "$COUNT" -eq 83

      - name: Build site
        run: npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
